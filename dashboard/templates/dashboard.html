<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cyber Attack Investigation Platform</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: #e5e7eb;
}

.container {
    width: 92%;
    max-width: 1400px;
    margin: auto;
    padding: 30px 0 60px;
}

header {
    margin-bottom: 30px;
}

header h1 {
    font-size: 32px;
    margin: 0 0 8px;
}

header p {
    color: #94a3b8;
}

.panel,
.card {
    background: #0f1b2d;
    border: 1px solid #1e293b;
    border-radius: 12px;
}

.panel {
    padding: 25px;
    margin-bottom: 25px;
}

.input-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

label {
    display: block;
    margin-bottom: 6px;
    color: #94a3b8;
    font-size: 13px;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #334155;
    border-radius: 6px;
    background: #08111f;
    color: white;
}

button {
    margin-top: 25px;
    padding: 13px 28px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    padding: 22px;
}

.card h3 {
    color: #94a3b8;
    font-size: 14px;
}

.attack {
    font-size: 25px;
    font-weight: bold;
}

.confidence {
    font-size: 25px;
    font-weight: bold;
}

.probability {
    margin: 15px 0;
}

.probability-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
}

.bar-container {
    height: 10px;
    background: #1e293b;
    border-radius: 5px;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: #2563eb;
}

.xai-row {
    display: grid;
    grid-template-columns: 220px 120px 1fr;
    gap: 15px;
    align-items: center;
    margin: 15px 0;
}

.xai-bar-container {
    height: 9px;
    background: #1e293b;
    border-radius: 5px;
}

.xai-bar {
    height: 100%;
    background: #22c55e;
}

pre {
    white-space: pre-wrap;
    line-height: 1.6;
    font-family: Arial, sans-serif;
}

.loading {
    padding: 20px;
    text-align: center;
}

.hidden {
    display: none;
}

@media(max-width: 900px) {

    .input-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .cards {
        grid-template-columns: 1fr;
    }

}

@media(max-width: 600px) {

    .input-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="container">

<header>

<h1>Cyber Attack Investigation Platform</h1>

<p>
Machine Learning • Explainable AI • Agentic Investigation • Groq
</p>

</header>


<!-- INPUT -->

<section class="panel">

<h2>Network Flow Input</h2>

<div class="input-grid">

<div>
<label>Source Port</label>
<input id="src_port" type="number" value="50147">
</div>

<div>
<label>Destination Port</label>
<input id="dst_port" type="number" value="5051">
</div>

<div>
<label>Flow Duration</label>
<input id="flow_duration" type="number" step="any" value="0.198">
</div>

<div>
<label>Total Packets</label>
<input id="total_packets" type="number" value="7">
</div>

<div>
<label>Total Bytes</label>
<input id="total_bytes" type="number" value="1010">
</div>

<div>
<label>Forward Packets</label>
<input id="forward_packets" type="number" value="7">
</div>

<div>
<label>Backward Packets</label>
<input id="backward_packets" type="number" value="0">
</div>

<div>
<label>Forward Bytes</label>
<input id="forward_bytes" type="number" value="1010">
</div>

<div>
<label>Backward Bytes</label>
<input id="backward_bytes" type="number" value="0">
</div>

<div>
<label>Packet Rate</label>
<input id="packet_rate" type="number" step="any" value="35.37058">
</div>

<div>
<label>Byte Rate</label>
<input id="byte_rate" type="number" step="any" value="5101.01">
</div>

<div>
<label>Average Packet Length</label>
<input id="avg_packet_length" type="number" step="any" value="144.2857">
</div>

<div>
<label>Minimum Packet Length</label>
<input id="min_packet_length" type="number" value="44">
</div>

<div>
<label>Maximum Packet Length</label>
<input id="max_packet_length" type="number" value="734">
</div>

<div>
<label>TCP SYN Count</label>
<input id="tcp_syn_count" type="number" value="1">
</div>

<div>
<label>TCP FIN Count</label>
<input id="tcp_fin_count" type="number" value="0">
</div>

<div>
<label>TCP ACK Count</label>
<input id="tcp_ack_count" type="number" value="1">
</div>

</div>

<button id="analyzeButton">
ANALYZE TRAFFIC
</button>

</section>


<div id="loading" class="loading hidden">
Analyzing network traffic...
</div>


<!-- RESULTS -->

<section id="results" class="hidden">


<div class="cards">


<div class="card">

<h3>DETECTED ATTACK</h3>

<div id="attack" class="attack">
—
</div>

</div>


<div class="card">

<h3>CONFIDENCE</h3>

<div id="confidence" class="confidence">
—
</div>

</div>


<div class="card">

<h3>SEVERITY</h3>

<div id="severity">
—
</div>

</div>


</div>


<!-- PROBABILITIES -->

<div class="panel">

<h2>Prediction Probabilities</h2>

<div id="probabilities"></div>

</div>


<!-- XAI -->

<div class="panel">

<h2>XAI Evidence</h2>

<div id="xai"></div>

</div>


<!-- LLM -->

<div class="panel">

<h2>AI Investigation Report</h2>

<pre id="report"></pre>

</div>


</section>

</div>


<script>

const API_URL = "http://127.0.0.1:5001/analyze";


function getNumber(id) {

    return Number(
        document.getElementById(id).value
    );

}


function buildRequestData() {

    return {

        src_port: getNumber("src_port"),

        dst_port: getNumber("dst_port"),

        flow_duration: getNumber("flow_duration"),

        total_packets: getNumber("total_packets"),

        total_bytes: getNumber("total_bytes"),

        forward_packets: getNumber("forward_packets"),

        backward_packets: getNumber("backward_packets"),

        forward_bytes: getNumber("forward_bytes"),

        backward_bytes: getNumber("backward_bytes"),

        packet_rate: getNumber("packet_rate"),

        byte_rate: getNumber("byte_rate"),

        avg_packet_length:
            getNumber("avg_packet_length"),

        min_packet_length:
            getNumber("min_packet_length"),

        max_packet_length:
            getNumber("max_packet_length"),

        tcp_syn_count:
            getNumber("tcp_syn_count"),

        tcp_fin_count:
            getNumber("tcp_fin_count"),

        tcp_ack_count:
            getNumber("tcp_ack_count")

    };

}


function displayProbabilities(probabilities) {

    const container =
        document.getElementById("probabilities");

    container.innerHTML = "";

    if (!probabilities) {

        container.innerHTML =
            "<p>No probability data available.</p>";

        return;

    }


    Object.entries(probabilities).forEach(
        ([attack, probability]) => {

            const div =
                document.createElement("div");

            div.className = "probability";

            div.innerHTML = `

                <div class="probability-label">

                    <span>${attack}</span>

                    <span>${Number(probability).toFixed(2)}%</span>

                </div>

                <div class="bar-container">

                    <div
                        class="bar"
                        style="width:${Math.min(Number(probability), 100)}%">
                    </div>

                </div>

            `;

            container.appendChild(div);

        }
    );

}


function displayXAI(features) {

    const container =
        document.getElementById("xai");

    container.innerHTML = "";


    if (!features || features.length === 0) {

        container.innerHTML =
            "<p>No XAI evidence available.</p>";

        return;

    }


    const maxImportance =
        Math.max(
            ...features.map(
                item => Math.abs(Number(item.importance) || 0)
            )
        );


    features.forEach(item => {

        const importance =
            Number(item.importance) || 0;

        const percentage =
            maxImportance === 0
                ? 0
                : Math.abs(importance)
                  / maxImportance * 100;


        const row =
            document.createElement("div");

        row.className = "xai-row";


        row.innerHTML = `

            <div>
                <strong>${item.feature}</strong>
            </div>

            <div>
                ${item.value}
            </div>

            <div class="xai-bar-container">

                <div
                    class="xai-bar"
                    style="width:${percentage}%">
                </div>

            </div>

        `;


        container.appendChild(row);

    });

}


/*
    Convert AI investigation object into readable text.
*/
function formatInvestigationReport(report) {

    if (report === null || report === undefined) {

        return "No AI investigation report was returned.";

    }


    // If Groq already returned normal text
    if (typeof report === "string") {

        return report;

    }


    // If the agent returned an object
    if (typeof report === "object") {

        // Common possible fields
        if (typeof report.report === "string") {

            return report.report;

        }

        if (typeof report.content === "string") {

            return report.content;

        }

        if (typeof report.text === "string") {

            return report.text;

        }


        // If report contains sections
        const sections = [];

        Object.entries(report).forEach(
            ([key, value]) => {

                let title =
                    String(key)
                        .replace(/_/g, " ")
                        .replace(/\b\w/g, c => c.toUpperCase());


                let content;


                if (typeof value === "string") {

                    content = value;

                }
                else if (Array.isArray(value)) {

                    content = value
                        .map(item => {

                            if (
                                typeof item === "object"
                                && item !== null
                            ) {

                                return "• " +
                                    Object.entries(item)
                                        .map(
                                            ([k, v]) =>
                                                `${k}: ${v}`
                                        )
                                        .join(" | ");

                            }

                            return "• " + item;

                        })
                        .join("\n");

                }
                else if (
                    typeof value === "object"
                    && value !== null
                ) {

                    content =
                        JSON.stringify(
                            value,
                            null,
                            2
                        );

                }
                else {

                    content = String(value);

                }


                sections.push(
                    `${title}\n${content}`
                );

            }
        );


        if (sections.length > 0) {

            return sections.join(
                "\n\n"
            );

        }


        return JSON.stringify(
            report,
            null,
            2
        );

    }


    return String(report);

}


/*
    Display all results.
*/
function displayResults(result) {

    console.log("API RESULT:", result);


    if (!result) {

        throw new Error(
            "Empty response received from API."
        );

    }


    const prediction =
        result.ml_prediction;


    if (!prediction) {

        throw new Error(
            "ML prediction missing from API response."
        );

    }


    /*
        ML ATTACK
    */

    document.getElementById("attack")
        .textContent =
        prediction.prediction || "UNKNOWN";


    /*
        CONFIDENCE
    */

    document.getElementById("confidence")
        .textContent =
        `${Number(prediction.confidence || 0).toFixed(2)}%`;


    /*
        SEVERITY
    */

    let severity = "UNKNOWN";

    const confidence =
        Number(prediction.confidence || 0);


    if (confidence >= 90) {

        severity = "HIGH";

    }
    else if (confidence >= 70) {

        severity = "MEDIUM";

    }
    else {

        severity = "LOW";

    }


    document.getElementById("severity")
        .textContent = severity;


    /*
        PROBABILITIES
    */

    displayProbabilities(
        prediction.probabilities
    );


    /*
        XAI
    */

    let xaiFeatures = [];


    if (
        result.xai_evidence
        && Array.isArray(
            result.xai_evidence.top_features
        )
    ) {

        xaiFeatures =
            result.xai_evidence.top_features;

    }
    else if (
        Array.isArray(result.xai_evidence)
    ) {

        xaiFeatures =
            result.xai_evidence;

    }


    displayXAI(xaiFeatures);


    /*
        GROQ AI INVESTIGATION REPORT
    */

    const reportElement =
        document.getElementById("report");


    const formattedReport =
        formatInvestigationReport(
            result.investigation_report
        );


    reportElement.textContent =
        formattedReport;


    /*
        SHOW RESULTS
    */

    document.getElementById("results")
        .classList.remove("hidden");


    /*
        Scroll to results
    */

    document.getElementById("results")
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

}


/*
    ANALYZE TRAFFIC
*/
async function analyzeTraffic() {

    const button =
        document.getElementById("analyzeButton");

    const loading =
        document.getElementById("loading");


    try {

        button.disabled = true;

        button.textContent =
            "ANALYZING...";


        loading.classList.remove("hidden");


        const data =
            buildRequestData();


        console.log(
            "Sending network flow:",
            data
        );


        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        /*
            Read API response
        */

        const result =
            await response.json();


        console.log(
            "API response:",
            result
        );


        /*
            Check API error
        */

        if (
            !response.ok
            || !result.success
        ) {

            throw new Error(
                result.error ||
                "Analysis failed."
            );

        }


        /*
            Display results
        */

        displayResults(result);

    }


    catch(error) {

        console.error(
            "Analysis error:",
            error
        );


        alert(
            "Error: " +
            error.message
        );

    }


    finally {

        button.disabled = false;

        button.textContent =
            "ANALYZE TRAFFIC";

        loading.classList.add("hidden");

    }

}


/*
    ANALYZE BUTTON
*/

document
    .getElementById("analyzeButton")
    .addEventListener(
        "click",
        analyzeTraffic
    );

</script>
